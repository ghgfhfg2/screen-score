title: "스크린스코어"
description: "일일 박스오피스 순위와 관객수 추이, 주간 드라마 시청률을 기록하는 스크린스코어입니다."
baseurl: ""
url: "https://screen-score.sooyadev.com"
lang: ko-KR
timezone: Asia/Seoul

theme: minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# 댓글(Disqus)
disqus:
  shortname: "sooyadev"

# 기본 URL 구조
permalink: /:categories/:title/

# 컬렉션/페이지 기본 레이아웃
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: "admin"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page

# 나중에 통계 포스트 카테고리 확장하기 쉽게 초기 카테고리 제안
# 예) drama-ratings, ott-rankings, boxoffice, trends

# Keep publishing scripts and local tooling out of the public site.
exclude:
  - scripts
  - templates
  - README.md
  - Gemfile
  - Gemfile.lock
